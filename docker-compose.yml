# Development infrastructure only: Postgres + Mailpit. The Next.js app and the worker run natively
# on your machine (fast refresh, no container overhead) — see README "Development (app runs natively)".
#   docker compose up -d      → Postgres on localhost:5432, Mailpit UI on http://localhost:8025 (SMTP :1025)
#   docker compose down       → stop (data is kept in the pgdata volume; add -v to wipe it)
# For a production-like stack (app built with `next build`, all in containers) use docker-compose.prod.yml.
name: hrms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["8025:8025", "1025:1025"]
    restart: unless-stopped

volumes:
  pgdata:
